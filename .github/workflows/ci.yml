name : Basic CI Pipelind

on:
  push:
      branches:
        - main
  pull_request:
    branches:
      - main

jobs:
  build: runs-on:ubuntu-latest

  steps:
  -name: Checkout source code
   uses: action/checkout@v4

   -name: Set up Node.js
    uses: action/setup-node@v4
    with:
      node-version: '20'
      
   -name: Install dependencies 
    run:  npm install 

    -name : Run tests
     run: npm test

    -name : Build application
     run: nmp run build
    
