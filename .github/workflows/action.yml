name: Basic CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show repo root (debug)
        run: ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (skip if no package.json)
        run: |
          if [ -f package.json ]; then
            echo "Found package.json — installing"
            npm install
          else
            echo "package.json not found — skipping npm install"
          fi

      - name: Run tests (skip if no package.json)
        run: |
          if [ -f package.json ]; then
            npm test || true
          else
            echo "Skipping tests"
          fi

      - name: Build application (skip if no package.json)
        run: |
          if [ -f package.json ]; then
            npm run build || true
          else
            echo "Skipping build"
          fi
